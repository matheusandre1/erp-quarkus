name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # verify roda os testes (@QuarkusTest com Dev Services/Docker) e o spotless:check
      - name: Build e testes
        run: ./mvnw -B verify
